<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Michelle Kanuri, data engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DDE2"/>
      <stop offset="0.55" stop-color="#E9D9EE"/>
      <stop offset="1" stop-color="#CDBBE3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98A9C"/>
      <stop offset="1" stop-color="#8E6FB3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="40" r="120" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="960" cy="230" r="90" fill="#B79AD3" opacity="0.30"/>
  <circle cx="70" cy="250" r="70" fill="#E7A9BB" opacity="0.30"/>
  <!-- little stream of data points flowing left to right -->
  <g fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <path d="M60 205 C 200 160, 300 235, 450 195 S 700 150, 940 200"/>
  </g>
  <g fill="#7C5A9B">
    <circle cx="60" cy="205" r="5"/>
    <circle cx="450" cy="195" r="5"/>
    <circle cx="940" cy="200" r="5"/>
  </g>
  <text x="60" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#432A47">Michelle Kanuri</text>
  <text x="62" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3" fill="#6B4A78">DATA ENGINEERING</text>
</svg>
